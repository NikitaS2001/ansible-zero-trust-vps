---
name: CI

'on':
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bootstrap development tools
        run: scripts/bootstrap.sh

      - name: Run quick checks
        run: scripts/check.sh

  qemu:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            image: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
            user: ubuntu
          - os: debian-12
            image: https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-generic-amd64.qcow2
            user: debian
    name: qemu / ${{ matrix.os }} / services_only
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install QEMU dependencies
        run: sudo apt-get update && sudo apt-get install -y genisoimage qemu-system-x86 qemu-utils

      - name: Enable KVM access
        run: sudo chmod a+rw /dev/kvm

      - name: Run services-only E2E
        env:
          QEMU_IMAGE: ${{ matrix.image }}
          QEMU_USER: ${{ matrix.user }}
          ZERO_TRUST_WG_TRAFFIC_MODE: services_only
        run: tests/e2e/qemu-install.sh --client-test --idempotency-test --reboot-test
