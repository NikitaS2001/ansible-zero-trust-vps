---
name: security

'on':
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-and-scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install shell tooling
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install Ansible lint tooling
        run: |
          python3 -m pip install --user "ansible-core==2.19.11" "ansible-lint==26.6.0" yamllint "passlib[bcrypt]" "bcrypt<4.1"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ansible-galaxy collection install -r requirements.yml

      - name: Prepare example inventory for syntax checks
        run: |
          cp inventory/hosts.yml.example inventory/hosts.yml
          cp group_vars/all/vars.yml.example group_vars/all/vars.yml
          cp group_vars/all/vault_services.yml.example group_vars/all/vault_services.yml
          cp group_vars/all/vault_ssh.yml.example group_vars/all/vault_ssh.yml

      - name: Ansible syntax check
        run: ansible-playbook --syntax-check site.yml

      - name: Run ansible-lint
        run: ansible-lint

      - name: Run yamllint
        run: yamllint .

      - name: Run shellcheck
        run: |
          shellcheck \
            install.sh \
            scripts/verify-ssot.sh \
            scripts/release-contract.sh \
            scripts/synthetic-check.sh \
            scripts/backup.sh \
            scripts/restore.sh \
            tests/e2e/common.sh \
            tests/e2e/qemu-install.sh \
            tests/e2e/qemu-remote-install.sh \
            tests/e2e/client-in-guest.sh \
            tests/e2e/external-client-qemu.sh \
            tests/e2e/vps-preflight.sh \
            tests/e2e/run-public-install.sh

      - name: Run SSOT verification
        run: scripts/verify-ssot.sh

      - name: Run release contract (structural on PR, strict on tags)
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            scripts/release-contract.sh --tag
          else
            scripts/release-contract.sh --pr
          fi

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETRIEVE_LOG: false
