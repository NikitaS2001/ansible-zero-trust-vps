---
- name: "AdGuard | Config | Generate password hash"
  set_fact:
    vault_adguard_password_hash: >-
      {{
        adguard_password | password_hash(
          'bcrypt',
          ((adguard_internal_domain ~ inventory_hostname) | hash('sha256'))[:22],
          ident='2y'
        )
      }}
  no_log: true
  changed_when: false
  when: adguard_password is defined
  tags: [adguard]

- name: "AdGuard | Config | Fail when no admin password is configured"
  fail:
    msg: >-
      No AdGuard admin password is configured. In public install mode the
      installer collects adguard_password; in remote mode set
      vault_adguard_password_hash in group_vars/all/vault_services.yml.
      An empty hash would render an invalid AdGuardHome.yaml and lock the
      admin out.
  when:
    - adguard_password is not defined
    - vault_adguard_password_hash | default("") | length == 0
  tags: [adguard]

- name: "AdGuard | Config | Deploy AdGuardHome.yaml before containers start"
  template:
    src: AdGuardHome.yaml.j2
    dest: "{{ project_root }}/volumes/adguard/conf/AdGuardHome.yaml"
    backup: yes
    mode: '0600'
  register: vps_orchestration_adguard_config
  no_log: true
  tags: [adguard]
