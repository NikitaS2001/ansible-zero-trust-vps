---
# Critical step: ufw-docker is required because Docker published ports bypass UFW.
- name: "UFW-Docker | Install | Download ufw-docker script"
  get_url:
    url: "https://raw.githubusercontent.com/chaifeng/ufw-docker/{{ ufw_docker_commit }}/ufw-docker"
    dest: /usr/local/bin/ufw-docker
    checksum: "{{ ufw_docker_checksum }}"
    mode: '0755'
  tags: [ufw_docker]

- name: "UFW-Docker | Install | Run ufw-docker install"
  command: ufw-docker install
  register: vps_orchestration_ufw_docker_install
  notify: reload ufw
  changed_when: >
    'skipping' not in ((vps_orchestration_ufw_docker_install.stdout ~ vps_orchestration_ufw_docker_install.stderr) | lower) and
    'already' not in ((vps_orchestration_ufw_docker_install.stdout ~ vps_orchestration_ufw_docker_install.stderr) | lower) and
    'exist' not in ((vps_orchestration_ufw_docker_install.stdout ~ vps_orchestration_ufw_docker_install.stderr) | lower)
  tags: [ufw_docker]

- name: "UFW-Docker | Install | Apply UFW-Docker rules immediately"
  meta: flush_handlers
  tags: [ufw_docker]

- name: "UFW-Docker | Allow | wg-easy WireGuard UDP"
  command: "ufw-docker allow wg-easy {{ wg_container_port }}/udp"
  register: vps_orchestration_ufw_docker_allow_wg
  changed_when: >
    'skipping' not in ((vps_orchestration_ufw_docker_allow_wg.stdout ~ vps_orchestration_ufw_docker_allow_wg.stderr) | lower) and
    'already' not in ((vps_orchestration_ufw_docker_allow_wg.stdout ~ vps_orchestration_ufw_docker_allow_wg.stderr) | lower) and
    'exist' not in ((vps_orchestration_ufw_docker_allow_wg.stdout ~ vps_orchestration_ufw_docker_allow_wg.stderr) | lower)
  tags: [ufw_docker]
