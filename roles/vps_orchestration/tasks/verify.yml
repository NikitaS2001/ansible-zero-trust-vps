---
- name: "Verify | CA | Wait for Caddy Root CA generation"
  wait_for:
    path: "{{ root_ca_path_on_host }}"
    timeout: 90
  tags: [verify]

- name: "Verify | CA | Fetch Root CA certificate"
  fetch:
    src: "{{ root_ca_path_on_host }}"
    dest: "{{ fetched_certs_dir }}/{{ inventory_hostname }}/root.crt"
    flat: yes
  tags: [verify]

- name: "Verify | UI | Wait for wg-easy bootstrap UI"
  uri:
    url: "http://127.0.0.1:{{ wg_easy_bootstrap_ui_port }}/"
    status_code: [200, 302]
  register: vps_orchestration_wg_easy_ui
  retries: 12
  delay: 5
  until: vps_orchestration_wg_easy_ui.status in [200, 302]
  tags: [verify]

- name: "Verify | WG | Wait for the WireGuard interface in wg-easy"
  command: docker exec wg-easy wg show
  register: vps_orchestration_wg_show
  changed_when: false
  retries: 18
  delay: 5
  until: vps_orchestration_wg_show.rc == 0
  tags: [verify]

- name: "Verify | WG | Confirm wg-easy admin API enforces authentication"
  uri:
    url: "http://127.0.0.1:{{ wg_easy_bootstrap_ui_port }}/api/session"
    status_code: 401
  register: vps_orchestration_wg_easy_session
  retries: 12
  delay: 5
  until: vps_orchestration_wg_easy_session.status == 401
  tags: [verify]

- name: "Verify | WG | wg-easy container env is free of INIT_PASSWORD"
  command: docker inspect wg-easy --format "{{ '{{ .Config.Env }}' }}"
  register: vps_orchestration_wg_env_check
  changed_when: false
  failed_when: "'INIT_PASSWORD' in vps_orchestration_wg_env_check.stdout"
  tags: [verify]

- name: "Verify | WG | wg-easy panel is not published on a public interface"
  command: docker port wg-easy
  register: vps_orchestration_wg_ports
  changed_when: false
  failed_when: >
    ('0.0.0.0:51821' in vps_orchestration_wg_ports.stdout)
    or (':::51821' in vps_orchestration_wg_ports.stdout)
  tags: [verify]

# CVE-2026-63089 mitigation: a weak one-time-link token can leak client keys,
# but only while the panel is reachable and a one-time link exists. The panel
# publicity check above is the primary control; this best-effort check fails
# if any one-time-link row is present (a missing table counts as clean).
- name: "Verify | WG | no active one-time links (CVE-2026-63089)"
  command: >
    docker exec wg-easy node -e
    "const{createClient}=require('@libsql/client');
    const db=createClient({url:'file:/etc/wireguard/wg-easy.db'});
    db.execute('SELECT count(*) c FROM one_time_links_table')
    .then(r=>process.exit(Number(r.rows[0].c)>0?1:0)).catch(()=>process.exit(0));"
  register: vps_orchestration_wg_otl
  changed_when: false
  failed_when: vps_orchestration_wg_otl.rc != 0
  tags: [verify]

- name: "Verify | UI | Wait for AdGuard bootstrap UI"
  uri:
    url: "http://127.0.0.1:{{ adguard_bootstrap_ui_port }}/control/status"
    return_content: true
    status_code: [200, 401]
  register: vps_orchestration_adguard_status
  retries: 12
  delay: 5
  until: vps_orchestration_adguard_status.status in [200, 401]
  tags: [verify]

- name: "Verify | SSH | Confirm SSH still accessible"
  wait_for:
    host: "{{ ansible_host }}"
    port: "{{ ssh_port }}"
    timeout: 30
  delegate_to: localhost
  when: ansible_connection != "local"
  tags: [verify]

- name: "Verify | Security | Confirm 443 is closed externally"
  wait_for:
    host: "{{ ansible_host }}"
    port: 443
    state: stopped
    timeout: 5
  delegate_to: localhost
  when: ansible_connection != "local"
  tags: [verify]

- name: "Verify | Summary | Print completion message"
  debug:
    msg:
      - "✅ Zero-Trust VPN deployment complete!"
      - "📄 Root CA: {{ fetched_certs_dir }}/{{ inventory_hostname }}/root.crt"
      - "🔗 WireGuard panel: https://{{ wg_internal_domain }} (or http://127.0.0.1:{{ wg_easy_bootstrap_ui_port }} over an SSH tunnel)"
      - "🔗 AdGuard panel: https://{{ adguard_internal_domain }}"
      - "🔑 Log in to the WireGuard panel with the password entered during installation"
      - "📖 Import the Root CA into your browser/OS to trust .internal certificates"
  tags: [verify]
