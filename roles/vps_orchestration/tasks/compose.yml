---
- name: "Compose | Detect | Check whether the wg-easy database exists"
  stat:
    path: "{{ project_root }}/volumes/wg-easy/wg-easy.db"
  register: vps_orchestration_wg_easy_db
  tags: [compose, wg_bootstrap_state]

- name: "Compose | Detect | Default wg-easy setup to incomplete"
  set_fact:
    wg_easy_initialized: false
  tags: [compose, wg_bootstrap_state]

- name: "Compose | Detect | Read authoritative wg-easy setup state"
  command:
    argv:
      - python3
      - -c
      - |
        import pathlib
        import sqlite3
        import sys

        database_uri = pathlib.Path(sys.argv[1]).resolve().as_uri() + "?mode=ro"
        with sqlite3.connect(database_uri, uri=True) as connection:
            rows = connection.execute(
                "SELECT setup_step FROM general_table"
            ).fetchall()
        if len(rows) != 1 or type(rows[0][0]) is not int:
            raise RuntimeError("unexpected wg-easy setup state")
        print("complete" if rows[0][0] == 0 else "incomplete")
      - "{{ project_root }}/volumes/wg-easy/wg-easy.db"
  register: vps_orchestration_wg_easy_setup_state
  changed_when: false
  when: vps_orchestration_wg_easy_db.stat.exists
  tags: [compose, wg_bootstrap_state]

- name: "Compose | Detect | Record authoritative wg-easy setup state"
  set_fact:
    wg_easy_initialized: >-
      {{ vps_orchestration_wg_easy_setup_state.stdout == 'complete' }}
  when: vps_orchestration_wg_easy_db.stat.exists
  tags: [compose, wg_bootstrap_state]

- name: "Compose | Detect | Select automated wg-easy bootstrap"
  set_fact:
    vps_orchestration_wg_easy_bootstrap_required: >-
      {{ (not wg_easy_initialized | bool)
         and (wg_easy_admin_password | length > 0) }}
  no_log: true
  tags: [compose]

- name: "Compose | Deploy | Write docker-compose.yml"
  template:
    src: docker-compose.yml.j2
    dest: "{{ project_root }}/docker-compose.yml"
    # No backup here: on a first deploy this render contains the panel
    # password in the INIT_* block and a .bak would preserve the secret.
    backup: no
    mode: >-
      {{ '0600' if vps_orchestration_wg_easy_bootstrap_required | bool
         else '0644' }}
  no_log: true
  vars:
    wg_easy_include_init: >-
      {{ vps_orchestration_wg_easy_bootstrap_required | bool }}
  tags: [compose]

- name: "Compose | Caddy | Prepare, validate, and activate managed config"
  tags: [compose]
  block:
    - name: "Compose | Caddy | Create managed candidate beside live file"
      tempfile:
        path: "{{ project_root }}"
        prefix: .Caddyfile.candidate.
        state: file
      register: vps_orchestration_caddy_candidate

    - name: "Compose | Caddy | Render managed candidate"
      template:
        src: Caddyfile.j2
        dest: "{{ vps_orchestration_caddy_candidate.path }}"
        mode: '0600'

    - name: "Compose | Caddy | Inspect managed candidate"
      stat:
        path: "{{ vps_orchestration_caddy_candidate.path }}"
        checksum_algorithm: sha256
      register: vps_orchestration_caddy_candidate_stat

    - name: "Compose | Caddy | Inspect live managed file"
      stat:
        path: "{{ project_root }}/Caddyfile"
        checksum_algorithm: sha256
      register: vps_orchestration_caddy_live

    - name: "Compose | Caddy | Create private validation tree"
      tempfile:
        path: "{{ project_root }}"
        prefix: .caddy-validate.
        state: directory
      register: vps_orchestration_caddy_validation_tree

    - name: "Compose | Caddy | Create private extension directory"
      file:
        path: "{{ vps_orchestration_caddy_validation_tree.path }}/Caddyfile.d"
        state: directory
        mode: '0700'

    - name: "Compose | Caddy | Inspect user extension directory"
      stat:
        path: "{{ project_root }}/Caddyfile.d"
      register: vps_orchestration_caddy_extensions

    - name: "Compose | Caddy | Copy user extensions into validation tree"
      copy:
        src: "{{ project_root }}/Caddyfile.d/"
        dest: "{{ vps_orchestration_caddy_validation_tree.path }}/Caddyfile.d/"
        remote_src: true
        mode: preserve
      when: vps_orchestration_caddy_extensions.stat.isdir | default(false)

    - name: "Compose | Caddy | Copy managed candidate into validation tree"
      copy:
        src: "{{ vps_orchestration_caddy_candidate.path }}"
        dest: "{{ vps_orchestration_caddy_validation_tree.path }}/Caddyfile"
        remote_src: true
        mode: '0600'

    - name: "Compose | Caddy | Hash complete candidate tree"
      command:
        argv:
          - python3
          - -c
          - |
            import hashlib
            import pathlib
            import sys

            root = pathlib.Path(sys.argv[1])
            digest = hashlib.sha256()
            for path in sorted(item for item in root.rglob("*") if item.is_file()):
                digest.update(path.relative_to(root).as_posix().encode())
                digest.update(b"\0")
                digest.update(path.read_bytes())
                digest.update(b"\0")
            print(digest.hexdigest())
          - "{{ vps_orchestration_caddy_validation_tree.path }}"
      register: vps_orchestration_caddy_candidate_tree_hash
      changed_when: false

    - name: "Compose | Caddy | Validate complete candidate tree"
      command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - none
          - --volume
          - "{{ vps_orchestration_caddy_validation_tree.path }}:/etc/caddy:ro"
          - caddy:{{ caddy_version }}
          - caddy
          - validate
          - --config
          - /etc/caddy/Caddyfile
          - --adapter
          - caddyfile
      register: vps_orchestration_caddy_validation
      changed_when: false
      failed_when: false
      no_log: true

    - name: "Compose | Caddy | Reject invalid candidate"
      fail:
        msg: "Caddy candidate validation failed; active configuration was not changed"
      when: vps_orchestration_caddy_validation.rc != 0

    - name: "Compose | Caddy | Read active tree hash"
      command:
        argv:
          - cat
          - "{{ project_root }}/.Caddyfile.active.sha256"
      register: vps_orchestration_caddy_active_tree_hash
      changed_when: false
      failed_when: false

    - name: "Compose | Caddy | Record whether activation is required"
      set_fact:
        vps_orchestration_caddy_activation_required: >-
          {{ not vps_orchestration_caddy_live.stat.exists
             or vps_orchestration_caddy_live.stat.checksum
                != vps_orchestration_caddy_candidate_stat.stat.checksum
             or vps_orchestration_caddy_live.stat.mode != '0600'
             or vps_orchestration_caddy_active_tree_hash.rc != 0
             or vps_orchestration_caddy_active_tree_hash.stdout
                != vps_orchestration_caddy_candidate_tree_hash.stdout }}

    - name: "Compose | Caddy | Detect running Caddy"
      command:
        argv:
          - docker
          - inspect
          - --format
          - "{{ '{{ .State.Running }}' }}"
          - caddy
      register: vps_orchestration_caddy_running
      changed_when: false
      failed_when: false

    - name: "Compose | Caddy | Activate validated managed config"
      when: vps_orchestration_caddy_activation_required | bool
      block:
        - name: "Compose | Caddy | Create prior-file placeholder"
          tempfile:
            path: "{{ project_root }}"
            prefix: .Caddyfile.previous.
            state: file
          register: vps_orchestration_caddy_previous
          when: vps_orchestration_caddy_live.stat.exists

        - name: "Compose | Caddy | Preserve prior managed file"
          copy:
            src: "{{ project_root }}/Caddyfile"
            dest: "{{ vps_orchestration_caddy_previous.path }}"
            remote_src: true
            mode: '0600'
          when: vps_orchestration_caddy_live.stat.exists

        # The live Caddyfile is a Docker *file* bind-mount. `mv` replaces the
        # inode, so a running Caddy keeps serving the old fd while
        # `.Caddyfile.active.sha256` tracks the new path. Truncate-and-write
        # keeps the mounted inode; first install (no live file) still creates it.
        - name: "Compose | Activate | Install validated Caddyfile in place"
          command:
            argv:
              - python3
              - -c
              - |
                import os
                import sys

                source, destination = sys.argv[1], sys.argv[2]
                with open(source, "rb") as handle:
                    data = handle.read()
                fd = os.open(
                    destination,
                    os.O_WRONLY | os.O_CREAT | os.O_TRUNC,
                    0o600,
                )
                try:
                    view = memoryview(data)
                    while view:
                        written = os.write(fd, view)
                        view = view[written:]
                    os.fsync(fd)
                finally:
                    os.close(fd)
                os.chmod(destination, 0o600)
              - "{{ vps_orchestration_caddy_candidate.path }}"
              - "{{ project_root }}/Caddyfile"

        - name: "Compose | Activate | Reload running Caddy"
          command:
            argv:
              - docker
              - exec
              - caddy
              - caddy
              - reload
              - --config
              - /etc/caddy/Caddyfile
              - --adapter
              - caddyfile
          when:
            - vps_orchestration_caddy_running.rc == 0
            - vps_orchestration_caddy_running.stdout == 'true'

        - name: "Compose | Activate | Record active tree hash"
          copy:
            content: "{{ vps_orchestration_caddy_candidate_tree_hash.stdout }}\n"
            dest: "{{ project_root }}/.Caddyfile.active.sha256"
            mode: '0600'

      rescue:
        - name: "Compose | Rollback | Restore prior managed file in place"
          command:
            argv:
              - python3
              - -c
              - |
                import os
                import sys

                source, destination = sys.argv[1], sys.argv[2]
                with open(source, "rb") as handle:
                    data = handle.read()
                fd = os.open(
                    destination,
                    os.O_WRONLY | os.O_CREAT | os.O_TRUNC,
                    0o600,
                )
                try:
                    view = memoryview(data)
                    while view:
                        written = os.write(fd, view)
                        view = view[written:]
                    os.fsync(fd)
                finally:
                    os.close(fd)
                os.chmod(destination, 0o600)
              - "{{ vps_orchestration_caddy_previous.path }}"
              - "{{ project_root }}/Caddyfile"
          when: vps_orchestration_caddy_live.stat.exists

        - name: "Compose | Rollback | Remove failed first-install file"
          file:
            path: "{{ project_root }}/Caddyfile"
            state: absent
          when: not vps_orchestration_caddy_live.stat.exists

        - name: "Compose | Rollback | Reload prior active config"
          command:
            argv:
              - docker
              - exec
              - caddy
              - caddy
              - reload
              - --config
              - /etc/caddy/Caddyfile
              - --adapter
              - caddyfile
          when:
            - vps_orchestration_caddy_live.stat.exists
            - vps_orchestration_caddy_running.rc == 0
            - vps_orchestration_caddy_running.stdout == 'true'

        - name: "Compose | Rollback | Report activation failure"
          fail:
            msg: "Caddy reload failed; prior managed and active configuration were restored"

  always:
    - name: "Compose | Caddy | Remove managed candidate"
      file:
        path: "{{ vps_orchestration_caddy_candidate.path }}"
        state: absent
      when: vps_orchestration_caddy_candidate.path is defined

    - name: "Compose | Caddy | Remove private validation tree"
      file:
        path: "{{ vps_orchestration_caddy_validation_tree.path }}"
        state: absent
      when: vps_orchestration_caddy_validation_tree.path is defined

    - name: "Compose | Caddy | Remove prior-file placeholder"
      file:
        path: "{{ vps_orchestration_caddy_previous.path }}"
        state: absent
      when: vps_orchestration_caddy_previous.path is defined

- name: "Compose | Run | Start Docker Compose stack"
  community.docker.docker_compose_v2:
    project_src: "{{ project_root }}"
    state: present
    recreate: auto
  no_log: "{{ vps_orchestration_wg_easy_bootstrap_required | bool }}"
  tags: [compose]

- name: "Compose | Bootstrap | Complete durable wg-easy setup"
  tags: [compose]
  block:
    - name: "Compose | Bootstrap | Authenticate initial wg-easy setup"
      uri:
        # wg-easy 15.4 moved password login from POST /api/session to POST /api/auth/password
        url: "http://127.0.0.1:{{ wg_easy_bootstrap_ui_port }}/api/auth/password"
        method: POST
        body_format: json
        body:
          username: "{{ wg_easy_admin_user }}"
          password: "{{ wg_easy_admin_password }}"
          remember: false
        return_content: true
        status_code: 200
      register: vps_orchestration_wg_easy_initial_login
      retries: 18
      delay: 5
      until:
        - vps_orchestration_wg_easy_initial_login.status == 200
        - vps_orchestration_wg_easy_initial_login.json.status == 'success'
      no_log: true
      when: vps_orchestration_wg_easy_bootstrap_required | bool

    - name: "Compose | Re-secure | Render Compose without INIT variables"
      template:
        src: docker-compose.yml.j2
        dest: "{{ project_root }}/docker-compose.yml"
        backup: no
        mode: '0644'
      vars:
        wg_easy_include_init: false
      no_log: true
      when: vps_orchestration_wg_easy_bootstrap_required | bool

    - name: "Compose | Re-secure | Recreate containers without INIT variables"
      community.docker.docker_compose_v2:
        project_src: "{{ project_root }}"
        state: present
        recreate: always
      no_log: true
      when: vps_orchestration_wg_easy_bootstrap_required | bool

    - name: "Compose | Bootstrap | Authenticate re-secured wg-easy setup"
      uri:
        # wg-easy 15.4 moved password login from POST /api/session to POST /api/auth/password
        url: "http://127.0.0.1:{{ wg_easy_bootstrap_ui_port }}/api/auth/password"
        method: POST
        body_format: json
        body:
          username: "{{ wg_easy_admin_user }}"
          password: "{{ wg_easy_admin_password }}"
          remember: false
        return_content: true
        status_code: 200
      register: vps_orchestration_wg_easy_resecured_login
      retries: 18
      delay: 5
      until:
        - vps_orchestration_wg_easy_resecured_login.status == 200
        - vps_orchestration_wg_easy_resecured_login.json.status == 'success'
      no_log: true
      when: vps_orchestration_wg_easy_bootstrap_required | bool

  rescue:
    - name: "Compose | Rescue | Render Compose without INIT variables"
      template:
        src: docker-compose.yml.j2
        dest: "{{ project_root }}/docker-compose.yml"
        backup: no
        mode: '0644'
      vars:
        wg_easy_include_init: false
      no_log: true

    - name: "Compose | Rescue | Inspect scrubbed persistent Compose"
      command:
        argv:
          - grep
          - -Eq
          - '^[[:space:]]+INIT_[A-Z_]+:'
          - "{{ project_root }}/docker-compose.yml"
      register: vps_orchestration_wg_easy_rescue_compose_init
      changed_when: false
      failed_when: >-
        vps_orchestration_wg_easy_rescue_compose_init.rc not in [0, 1]
      no_log: true

    - name: "Compose | Rescue | Fail closed when persistent INIT variables remain"
      fail:
        msg: "wg-easy bootstrap failed and persistent credential cleanup could not be verified"
      when: vps_orchestration_wg_easy_rescue_compose_init.rc == 0
      no_log: true

    - name: "Compose | Rescue | Remove potentially credential-bearing wg-easy"
      command:
        argv: [docker, rm, --force, wg-easy]
      changed_when: true
      failed_when: false
      no_log: true

    - name: "Compose | Rescue | Recreate from secret-free Compose"
      community.docker.docker_compose_v2:
        project_src: "{{ project_root }}"
        state: present
        recreate: always
      register: vps_orchestration_wg_easy_rescue_recreate
      failed_when: false
      no_log: true

    - name: "Compose | Rescue | Inspect scrubbed wg-easy environment"
      command:
        argv:
          - docker
          - inspect
          - wg-easy
          - --format
          - "{{ '{{ range .Config.Env }}{{ println . }}{{ end }}' }}"
      register: vps_orchestration_wg_easy_rescue_env
      changed_when: false
      failed_when: false
      no_log: true

    - name: "Compose | Rescue | Record credential scrub result"
      set_fact:
        vps_orchestration_wg_easy_rescue_secret_free: >-
          {{ vps_orchestration_wg_easy_rescue_env.rc != 0
             or (vps_orchestration_wg_easy_rescue_env.stdout_lines
                 | select('match', '^INIT_')
                 | reject('equalto', 'INIT_ENABLED=false')
                 | list
                 | length == 0) }}
      no_log: true

    - name: "Compose | Rescue | Fail closed when INIT_PASSWORD remains"
      fail:
        msg: "wg-easy bootstrap failed and password cleanup could not be verified"
      when:
        - vps_orchestration_wg_easy_rescue_env.rc == 0
        - >-
          vps_orchestration_wg_easy_rescue_env.stdout_lines
          | select('match', '^INIT_PASSWORD=')
          | list
          | length > 0
      no_log: true

    - name: "Compose | Rescue | Fail closed when unsafe INIT variables remain"
      fail:
        msg: "wg-easy bootstrap failed and credential cleanup could not be verified"
      when: not vps_orchestration_wg_easy_rescue_secret_free | bool
      no_log: true

    - name: "Compose | Rescue | Report redacted bootstrap failure"
      fail:
        msg: "wg-easy automated bootstrap failed; secret state was scrubbed and setup remains retryable"

  always:
    - name: "Compose | Cleanup | Find legacy Compose backups"
      find:
        paths: "{{ project_root }}"
        patterns: "docker-compose.yml.bak*"
        file_type: file
      register: vps_orchestration_legacy_baks

    - name: "Compose | Cleanup | Delete legacy Compose backups"
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ vps_orchestration_legacy_baks.files }}"
      no_log: true
