---
- name: "Compose | Detect | Check whether wg-easy was already initialized"
  stat:
    path: "{{ project_root }}/volumes/wg-easy/wg0.conf"
  register: vps_orchestration_wg_easy_conf
  tags: [compose]

- name: "Compose | Deploy | Write docker-compose.yml"
  template:
    src: docker-compose.yml.j2
    dest: "{{ project_root }}/docker-compose.yml"
    backup: yes
    mode: '0644'
  vars:
    wg_easy_initialized: "{{ vps_orchestration_wg_easy_conf.stat.exists | bool }}"
  tags: [compose]

- name: "Compose | Deploy | Write Caddyfile"
  template:
    src: Caddyfile.j2
    dest: "{{ project_root }}/Caddyfile"
    backup: yes
    mode: '0644'
  tags: [compose]

- name: "Compose | Run | Start Docker Compose stack"
  community.docker.docker_compose_v2:
    project_src: "{{ project_root }}"
    state: present
    recreate: "{{ 'always' if vps_orchestration_adguard_config.changed | default(false) else 'auto' }}"
  tags: [compose]

# On the first deploy the Compose file above contained the wg-easy panel
# password in the INIT_* block. wg-easy consumed it during its first start,
# so re-render the file without the block in the same run instead of leaving
# the plaintext on disk until the next playbook invocation.
- name: "Compose | Re-secure | Remove the INIT_* block from the Compose file"
  template:
    src: docker-compose.yml.j2
    dest: "{{ project_root }}/docker-compose.yml"
    mode: '0644'
  vars:
    wg_easy_initialized: true
  when: not vps_orchestration_wg_easy_conf.stat.exists
  tags: [compose]
