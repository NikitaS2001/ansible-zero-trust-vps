---
- name: "Docker | Install | Ensure apt keyring directory exists"
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  tags: [docker]

- name: "Docker | Install | Download Docker apt signing key"
  get_url:
    url: "{{ docker_apt_gpg_url }}"
    dest: /etc/apt/keyrings/docker.asc
    checksum: "{{ docker_apt_gpg_checksum }}"
    mode: '0644'
  tags: [docker]

- name: "Docker | Install | Add Docker apt repository"
  apt_repository:
    repo: >-
      deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      {{ docker_apt_repo_url }} {{ docker_apt_release }} stable
    state: present
    update_cache: yes
    filename: docker
  tags: [docker]

- name: "Docker | Install | Install Docker CE"
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
  tags: [docker]

- name: "Docker | Config | Deploy daemon.json"
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    backup: yes
    mode: '0644'
  notify: restart docker
  tags: [docker]

- name: "Docker | User | Ensure admin is in docker group"
  user:
    name: "{{ admin_user }}"
    groups: docker
    append: yes
  tags: [docker]
