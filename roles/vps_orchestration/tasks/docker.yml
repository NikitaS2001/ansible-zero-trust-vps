---
- name: "Docker | Install | Ensure apt keyring directory exists"
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  tags: [docker]

- name: "Docker | Install | Download Docker apt signing key"
  get_url:
    url: "{{ docker_apt_gpg_url }}"
    dest: /etc/apt/keyrings/docker.asc
    checksum: "{{ docker_apt_gpg_checksum }}"
    mode: '0644'
  tags: [docker]

- name: "Docker | Install | Add Docker apt repository"
  apt_repository:
    repo: >-
      deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      {{ docker_apt_repo_url }} {{ docker_apt_release }} stable
    state: present
    update_cache: yes
    filename: docker
  tags: [docker]

- name: "Docker | Install | Install Docker CE"
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
  tags: [docker]

- name: "Docker | Config | Deploy daemon.json"
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    backup: yes
    mode: '0644'
  register: vps_orchestration_docker_daemon_config
  tags: [docker]

- name: "Docker | Service | Ensure containerd is enabled and running"
  service:
    name: containerd
    state: started
    enabled: yes
  tags: [docker]

- name: "Docker | Service | Reset Docker failed state"  # noqa: command-instead-of-module
  command: systemctl reset-failed docker.service docker.socket
  changed_when: false
  failed_when: false
  tags: [docker]

- name: "Docker | Service | Check Docker socket unit"  # noqa: command-instead-of-module
  command: systemctl list-unit-files docker.socket --no-legend
  register: vps_orchestration_docker_socket_unit
  changed_when: false
  failed_when: false
  tags: [docker]

- name: "Docker | Service | Ensure Docker socket is enabled and running"
  service:
    name: docker.socket
    state: started
    enabled: yes
  when: vps_orchestration_docker_socket_unit.rc == 0
  tags: [docker]

- name: "Docker | Service | Start Docker with diagnostics"
  tags: [docker]
  block:
    - name: "Docker | Service | Restart Docker after daemon config change"
      service:
        name: docker
        state: restarted
        enabled: yes
      when: vps_orchestration_docker_daemon_config.changed
      tags: [docker]

    - name: "Docker | Service | Ensure Docker is enabled and running"
      service:
        name: docker
        state: started
        enabled: yes
      tags: [docker]
  rescue:
    - name: "Docker | Diagnose | Read Docker service status"  # noqa: command-instead-of-module
      command: systemctl status docker --no-pager
      register: vps_orchestration_docker_status
      changed_when: false
      failed_when: false
      tags: [docker]

    - name: "Docker | Diagnose | Read Docker service journal"  # noqa: command-instead-of-module
      command: journalctl -xeu docker.service --no-pager -n 80
      register: vps_orchestration_docker_journal
      changed_when: false
      failed_when: false
      tags: [docker]

    - name: "Docker | Diagnose | Fail with Docker startup details"
      fail:
        msg: |
          Docker daemon failed to start.

          systemctl status docker:
          {{ vps_orchestration_docker_status.stdout | default("") }}
          {{ vps_orchestration_docker_status.stderr | default("") }}

          journalctl -xeu docker.service -n 80:
          {{ vps_orchestration_docker_journal.stdout | default("") }}
          {{ vps_orchestration_docker_journal.stderr | default("") }}
      tags: [docker]

- name: "Docker | User | Ensure admin is in docker group"
  user:
    name: "{{ admin_user }}"
    groups: docker
    append: yes
  tags: [docker]
