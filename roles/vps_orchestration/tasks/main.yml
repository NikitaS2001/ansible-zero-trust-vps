---
- name: "VPS Orchestration | Preflight | Probe host IPv6 connectivity"
  command: ip -6 route get 2001:4860:4860::8888
  register: vps_orchestration_ipv6_probe
  changed_when: false
  failed_when: false
  when: wg_enable_ipv6 | default(false) | bool
  tags: [compose]

- name: "VPS Orchestration | Preflight | Refuse IPv6 mode without host IPv6"
  fail:
    msg: >
      wg_enable_ipv6 is true but this host has no IPv6 connectivity
      (ip -6 route get returned rc={{ vps_orchestration_ipv6_probe.rc }}).
      The VPN cannot route IPv6 client traffic without host IPv6 egress.
      Keep the default (IPv6 disabled) or deploy on a dual-stack host.
  when:
    - wg_enable_ipv6 | default(false) | bool
    - vps_orchestration_ipv6_probe.rc != 0
  tags: [compose]

- name: "VPS Orchestration | Preflight | wg-easy panel password meets v15 minimum"
  assert:
    that: wg_easy_admin_password | length == 0 or wg_easy_admin_password | length >= 12
    msg: >
      wg_easy_admin_password must be empty (manual wizard setup) or at least
      12 characters; wg-easy v15 rejects shorter passwords at login.
  tags: [compose]

- name: "VPS Orchestration | Preflight | Internal domains match the configured suffix"
  fail:
    msg: >
      {{ wg_internal_domain }} / {{ adguard_internal_domain }} must end with
      .{{ internal_domain_suffix }} so the AdGuard wildcard rewrite covers them.
  when: not wg_internal_domain.endswith('.' ~ internal_domain_suffix) \
    or not adguard_internal_domain.endswith('.' ~ internal_domain_suffix)
  tags: [compose]

- name: "VPS Orchestration | Preflight | Docker and WireGuard subnets do not overlap"
  fail:
    msg: >
      docker_network_subnet ({{ docker_network_subnet }}) must not overlap the
      WireGuard subnet ({{ wg_vpn_subnet }}).
  when: docker_network_subnet.split('.')[0] == wg_vpn_subnet.split('.')[0] \
    and docker_network_subnet.split('.')[1] == wg_vpn_subnet.split('.')[1]
  tags: [compose]

- name: "VPS Orchestration | Main | Include Docker setup"
  include_tasks: docker.yml
  tags: [docker]

- name: "VPS Orchestration | Main | Include volume setup"
  include_tasks: volumes.yml
  tags: [volumes]

- name: "VPS Orchestration | Main | Include AdGuard config"
  include_tasks: adguard_config.yml
  tags: [adguard]

- name: "VPS Orchestration | Main | Include Compose deployment"
  include_tasks: compose.yml
  tags: [compose]

- name: "VPS Orchestration | Main | Include UFW-Docker integration [C2]"
  include_tasks: ufw_docker.yml
  tags: [ufw_docker]

- name: "VPS Orchestration | Main | Include verification"
  include_tasks: verify.yml
  tags: [verify]
