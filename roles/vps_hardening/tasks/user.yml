---
- name: "VPS Hardening | User | Ensure docker group exists"
  ansible.builtin.group:
    name: docker
    state: present
  tags: [user]

- name: "VPS Hardening | User | Create key-only admin user"
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: "{{ admin_group }},docker"
    # append: no makes group membership convergent: a removed privileged group
    # is dropped on the next run instead of lingering.
    append: no
    state: present
    shell: "{{ admin_shell }}"
    # Empty is intentionally omitted: SSH password authentication is disabled
    # and the account remains locked unless the operator supplied a hash.
    password: "{{ admin_password_hash | default(omit, true) }}"
    password_lock: "{{ admin_password_hash | default('') | length == 0 }}"
    update_password: "{{ 'always' if (admin_password_hash | default('') | length > 0) else 'on_create' }}"
  no_log: true
  tags: [user]

- name: "VPS Hardening | User | Add SSH authorized key"
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ vault_admin_ssh_pubkey }}"
    state: present
    # exclusive removes keys that are no longer managed by the role, so key
    # rotation revokes the old key instead of appending it.
    exclusive: "{{ vps_hardening_authorized_keys_exclusive | bool }}"
  # Never run with an empty key: exclusive + a missing pubkey would remove
  # every key from the account and lock the operator out.
  when: vault_admin_ssh_pubkey | default('') | length > 0
  no_log: true
  tags: [user]

- name: "VPS Hardening | User | Configure passwordless sudo"
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ admin_user }}"
    content: "{{ admin_user }} ALL=(ALL) NOPASSWD: ALL\n"
    validate: 'visudo -cf %s'
    mode: '0440'
  tags: [user]
