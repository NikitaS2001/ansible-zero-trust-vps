---
# Critical order: open SSH before default deny and firewall enable.
- name: "UFW | Allow | Custom SSH port before any deny policies"
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp
  tags: [ufw]

- name: "UFW | Allow | Current SSH connection port for rollback safety"
  community.general.ufw:
    rule: allow
    port: "{{ ansible_port | int }}"
    proto: tcp
  when:
    - ansible_connection | default("") != "local"
    - ansible_port is defined
    - (ansible_port | int) != (ssh_port | int)
  tags: [ufw]

- name: "UFW | Allow | WireGuard UDP port"
  community.general.ufw:
    rule: allow
    port: "{{ wg_port }}"
    proto: udp
  tags: [ufw]

- name: "UFW | Policy | Default deny incoming"
  community.general.ufw:
    default: deny
    direction: incoming
  tags: [ufw]

- name: "UFW | State | Enable firewall"
  community.general.ufw:
    state: enabled
  when:
    - ansible_facts["virtualization_type"] | default("") not in ["lxc", "openvz"]
    - >-
      (ansible_connection | default("")) != "local"
      or (vps_hardening_enable_ufw_on_local_connection | bool)
  tags: [ufw]

- name: "UFW | Debug | Skip enable on LXC/OpenVZ"
  debug:
    msg: "Skipping UFW enable on LXC/OpenVZ - UFW may not be supported in container."
  when: ansible_facts["virtualization_type"] | default("") in ["lxc", "openvz"]
  tags: [ufw]

- name: "UFW | Debug | Skip enable on local connection"
  debug:
    msg: "Skipping UFW enable on local Ansible connection without explicit opt-in."
  when:
    - ansible_facts["virtualization_type"] | default("") not in ["lxc", "openvz"]
    - (ansible_connection | default("")) == "local"
    - not (vps_hardening_enable_ufw_on_local_connection | bool)
  tags: [ufw]
