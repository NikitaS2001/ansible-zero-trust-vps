---
- name: "SSH | Config | Apply and verify hardened sshd_config"
  block:
    - name: "SSH | Config | Apply hardened sshd_config"
      template:
        src: sshd_config.j2
        dest: /etc/ssh/sshd_config
        validate: '/usr/sbin/sshd -t -f %s'
        backup: yes
        mode: '0644'
      register: vps_hardening_sshd_config
      notify: restart sshd
      tags: [ssh]

    - name: "SSH | Socket | Check systemd socket unit"  # noqa: command-instead-of-module
      command: "systemctl list-unit-files {{ ssh_socket_name }} --no-legend"
      register: vps_hardening_ssh_socket_unit
      changed_when: false
      failed_when: false
      when: vps_hardening_manage_ssh_socket | bool
      tags: [ssh]

    - name: "SSH | Socket | Disable socket activation for hardened sshd_config"
      service:
        name: "{{ ssh_socket_name }}"
        state: stopped
        enabled: no
      when:
        - vps_hardening_manage_ssh_socket | bool
        - vps_hardening_ssh_socket_unit.rc | default(1) == 0
      notify: restart sshd
      tags: [ssh]

    - name: "SSH | Service | Enable sshd service for boot"
      service:
        name: "{{ ssh_service_name }}"
        state: started
        enabled: yes
      when:
        - vps_hardening_manage_ssh_socket | bool
        - vps_hardening_ssh_socket_unit.rc | default(1) == 0
      notify: restart sshd
      tags: [ssh]

    - name: "SSH | Flush | Force handler execution now"
      meta: flush_handlers
      tags: [ssh]

    - name: "SSH | Verify | Wait for local sshd on new port"
      wait_for:
        port: "{{ ssh_port }}"
        host: 127.0.0.1
        timeout: 30
      when: ansible_connection == "local"
      tags: [ssh]

    - name: "SSH | Verify | Wait for sshd on new port"
      wait_for:
        port: "{{ ssh_port }}"
        host: "{{ ansible_host }}"
        timeout: 30
      delegate_to: localhost
      when: ansible_connection != "local"
      tags: [ssh]
  rescue:
    - name: "SSH | Rescue | Restore previous sshd_config"
      copy:
        src: "{{ vps_hardening_sshd_config.backup_file }}"
        dest: /etc/ssh/sshd_config
        remote_src: true
        mode: '0644'
      when: vps_hardening_sshd_config.backup_file is defined
      notify: restart sshd
      tags: [ssh]

    - name: "SSH | Rescue | Restart sshd after rollback"
      meta: flush_handlers
      tags: [ssh]

    - name: "SSH | Rescue | Fail after restoring previous sshd_config"
      fail:
        msg: >-
          Hardened SSH config was applied but the new SSH port was unreachable.
          The previous sshd_config was restored when a backup was available.
      tags: [ssh]

# Cutover succeeded: drop the temporary allow rule for the old connection
# port that ufw.yml added, so the firewall converges instead of keeping an
# orphaned open port. On rollback (the rescue above) this task is skipped and
# the old-port rule stays, preserving access.
- name: "SSH | Cleanup | Remove temporary old-port UFW allow after cutover"
  community.general.ufw:
    rule: allow
    port: "{{ ansible_port | int }}"
    proto: tcp
    delete: yes
  when:
    - ansible_connection | default("") != "local"
    - ansible_port is defined
    - (ansible_port | int) != (ssh_port | int)
  # The rule may legitimately not exist (e.g. the connection used the new port
  # already); that is not a failure.
  failed_when: false
  tags: [ssh]

- name: "SSH | Update | Set ansible connection for remainder"  # noqa: var-naming[no-role-prefix]
  set_fact:
    ansible_port: "{{ ssh_port }}"
    ansible_user: "{{ admin_user }}"
  when: ansible_connection != "local"
  tags: [ssh]
