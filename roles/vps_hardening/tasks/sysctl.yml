---
- name: "VPS Hardening | Sysctl | Apply kernel hardening settings"
  template:
    src: sysctl.conf.j2
    dest: /etc/sysctl.d/99-zero-trust.conf
    backup: yes
    mode: '0644'
  when: ansible_virtualization_type not in ['lxc', 'openvz']
  notify: reload sysctl
  tags: [sysctl]

- name: "VPS Hardening | Sysctl | Apply sysctl immediately"
  command: sysctl -p /etc/sysctl.d/99-zero-trust.conf
  register: vps_hardening_sysctl_apply
  when: ansible_virtualization_type not in ['lxc', 'openvz']
  changed_when: vps_hardening_sysctl_apply.stdout_lines | length > 0
  tags: [sysctl]
