---
- name: "VPS Hardening | Main | Include preflight checks"
  ansible.builtin.include_tasks: preflight.yml
  # `always` makes the physical-memory gate run even when an operator selects
  # a later tag such as `packages` or `user`.
  tags: [always, preflight]

- name: "VPS Hardening | Main | Include package setup"
  ansible.builtin.include_tasks: packages.yml
  tags: [packages]

- name: "VPS Hardening | Main | Include user setup"
  ansible.builtin.include_tasks: user.yml
  tags: [user]

- name: "VPS Hardening | Main | Include sysctl hardening"
  ansible.builtin.include_tasks: sysctl.yml
  tags: [sysctl]

- name: "VPS Hardening | Main | Include UFW setup [C1]"
  ansible.builtin.include_tasks: ufw.yml
  tags: [ufw]

- name: "VPS Hardening | Main | Include SSH hardening [C1]"
  ansible.builtin.include_tasks: ssh.yml
  tags: [ssh]

- name: "VPS Hardening | Main | Include Fail2Ban setup"
  ansible.builtin.include_tasks: fail2ban.yml
  tags: [fail2ban]
