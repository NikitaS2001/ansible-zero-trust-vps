---
repos:
  - repo: https://github.com/ansible/ansible-lint
    rev: 262624cd0ab22a4221293216856c59671ce7aa5e  # v26.6.0
    hooks:
      - id: ansible-lint
        args: [--strict]

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a23f6b85d0fdd5bb9d564e2579e678033debbdff  # v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/gitleaks/gitleaks
    rev: 39fdb480a06768cc41a84ef86959c07ff33091c4  # v8.28.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: project-contracts
        name: Project contracts
        entry: scripts/check.sh
        language: system
        pass_filenames: false
