title = "ansible-zero-trust-vps gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Non-secret template placeholders"
condition = "OR"
regexes = [
  '''replace-with-[A-Za-z0-9-]+''',
  '''ssh-ed25519 AAAA\.\.\. your-key-here''',
  '''203\.0\.113\.10''',
  '''\$2y\$10\$replace-with-bcrypt-hash-only''',
  '''<ansible_host>''',
  '''<admin_user>''',
  '''<ssh_port>''',
]
